# Notify IndexNow (Bing, Yandex, Seznam, Naver and others) about every URL in
# the sitemap after a successful production deploy on Vercel.
# Never fails the run: a network or API error is logged as a warning.
name: IndexNow

on:
  deployment_status:

permissions:
  contents: read

jobs:
  ping:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    env:
      SITE_HOST: www.fixfusionbuild.com
      SITE_ORIGIN: https://www.fixfusionbuild.com
      SITEMAP_URL: https://www.fixfusionbuild.com/sitemap.xml
      INDEXNOW_KEY: 6d9683e9d67acb95f32d95c1adc7c3dd
    steps:
      - name: Collect URLs from the sitemap and submit them
        shell: bash
        run: |
          set -uo pipefail

          fetch() { curl -fsSL --retry 3 --retry-delay 5 --max-time 30 "$1"; }
          locs() { grep -o '<loc>[^<]*</loc>' | sed -e 's#<loc>##' -e 's#</loc>##' -e 's#&amp;#\&#g'; }

          # Give the production alias a moment to switch to the new build.
          sleep 15

          if ! root=$(fetch "$SITEMAP_URL"); then
            echo "::warning::Could not fetch $SITEMAP_URL, skipping IndexNow"
            exit 0
          fi

          if grep -q '<sitemapindex' <<<"$root"; then
            urls=""
            while read -r child; do
              [ -n "$child" ] || continue
              if body=$(fetch "$child"); then
                urls+="$(locs <<<"$body")"$'\n'
              else
                echo "::warning::Could not fetch child sitemap $child"
              fi
            done < <(locs <<<"$root")
          else
            urls=$(locs <<<"$root")
          fi

          # Only URLs of this host are accepted by IndexNow.
          urls=$(grep -E "^${SITE_ORIGIN}(/|$)" <<<"$urls" | sort -u)
          count=$(grep -c . <<<"$urls" || true)
          if [ "$count" -eq 0 ]; then
            echo "::warning::No URLs found in the sitemap, skipping IndexNow"
            exit 0
          fi
          echo "Submitting $count URL(s) to IndexNow"

          payload=$(jq -Rn \
            --arg host "$SITE_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "$SITE_ORIGIN/$INDEXNOW_KEY.txt" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: [inputs | select(length > 0)]}' \
            <<<"$urls")

          status=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' --max-time 30 \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$payload") || status="network-error"
          echo "IndexNow responded: $status"
          cat /tmp/indexnow.out 2>/dev/null || true
          case "$status" in
            200|202) ;;
            *) echo "::warning::IndexNow returned $status" ;;
          esac
          exit 0
